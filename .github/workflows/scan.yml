# JobRadar in the cloud (public repository, everything personal encrypted).
#  - code: this repository (no personal data in it – checked below)
#  - your CV / profile / Telegram / Gmail: repository secrets
#  - database + tailored CVs: one encrypted file (vault.bin) kept in the Actions cache, backed up to the `state` branch
#  - dashboard: encrypted site on GitHub Pages; your private link carries the key after '#'
name: JobRadar scan
run-name: ${{ github.event.inputs.quick == 'true' && 'JobRadar quick CV rebuild' || 'JobRadar scan' }}

on:
  schedule:
    - cron: "*/15 * * * *"        # GitHub can delay scheduled runs by 5-20 minutes when busy
  workflow_dispatch:
    inputs:
      force:
        description: "Scan every company now (first run / after changes)"
        type: boolean
        default: false
      digest:
        description: "Also send today's digest now"
        type: boolean
        default: false
      quick:
        description: "Only rebuild CVs + dashboard (no scan) - used by the dashboard after you add a skill"
        type: boolean
        default: false

# GitHub's timer is best-effort and often fires only every few hours, so each scan also starts the next one
# ~15 minutes after it began (job `next`). Turn the chain off with the repository variable SCAN_CHAIN = off;
# change the gap with SCAN_GAP_MINUTES (default 15). The timer above stays as a backup that restarts the chain.

permissions:
  contents: write
  pages: write
  id-token: write
  actions: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    concurrency:              # one scan at a time (they share the encrypted database)
      group: jobradar-state
      cancel-in-progress: false
    outputs:
      published: ${{ steps.pub.outputs.published }}
    env:
      JOBRADAR_KEY: ${{ secrets.JOBRADAR_KEY }}
      PYTHONUTF8: "1"
      # RankOne X apply packs switch on when both secrets exist (private code + your profile); otherwise skipped
      HAS_RANKONEX: ${{ secrets.RANKONEX_TOKEN != '' && secrets.RANKONE_PROFILE != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Safety check – no personal files in the public code
        run: |
          bad=0
          for f in config/resume.json config/profile.toml .env state output CLOUD_SETUP_PRIVATE.txt rankonex; do
            if [ -e "$f" ]; then echo "::error::'$f' must NOT be in this public repository - delete it on GitHub"; bad=1; fi
          done
          [ -n "$JOBRADAR_KEY" ] || { echo "::error::The JOBRADAR_KEY secret is missing (see CLOUD_SETUP_PRIVATE.txt on your PC)"; bad=1; }
          exit $bad

      # private repository, read with a fine-grained read-only token; it is never committed or published
      - name: RankOne X code (private)
        if: env.HAS_RANKONEX == 'true'
        uses: actions/checkout@v4
        with:
          repository: Nishadwankhede1/rankonex
          token: ${{ secrets.RANKONEX_TOKEN }}
          path: rankonex
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: "**/requirements*.txt"

      - name: Install
        run: pip install --quiet -r requirements-cloud.txt

      - name: RankOne X setup
        if: env.HAS_RANKONEX == 'true'
        env:
          RANKONE_PROFILE: ${{ secrets.RANKONE_PROFILE }}
        run: |
          pip install --quiet -r rankonex/backend/requirements.txt
          printf '%s' "$RANKONE_PROFILE" > "$RUNNER_TEMP/rankone_profile.txt"
          echo "RANKONEX_DIR=$GITHUB_WORKSPACE/rankonex/backend" >> "$GITHUB_ENV"
          echo "RANKONE_PROFILE_FILE=$RUNNER_TEMP/rankone_profile.txt" >> "$GITHUB_ENV"

      - name: CV font (Carlito, same metrics as Calibri)
        run: |
          if [ ! -f jobradar/resume/fonts/Carlito-Regular.ttf ] && [ ! -f /usr/share/fonts/truetype/crosextra/Carlito-Regular.ttf ]; then
            sudo apt-get install -y -qq fonts-crosextra-carlito >/dev/null 2>&1 || \
              (sudo apt-get update -qq >/dev/null && sudo apt-get install -y -qq fonts-crosextra-carlito >/dev/null)
          fi

      - name: Your private settings (from secrets, never printed)
        env:
          RESUME_JSON: ${{ secrets.RESUME_JSON }}
          PROFILE_TOML: ${{ secrets.PROFILE_TOML }}
        run: |
          [ -n "$PROFILE_TOML" ] || { echo "::error::The PROFILE_TOML secret is missing"; exit 1; }
          printf '%s' "$PROFILE_TOML" > config/profile.toml
          if [ -n "$RESUME_JSON" ]; then printf '%s' "$RESUME_JSON" > config/resume.json; fi

      - name: Restore encrypted state (cache)
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: vault.bin
          key: vault-${{ github.run_id }}
          restore-keys: vault-

      - name: Restore encrypted state (backup branch)
        if: steps.cache.outputs.cache-matched-key == ''
        run: |
          if git ls-remote --exit-code --heads origin state >/dev/null 2>&1; then
            git fetch -q --depth=1 origin state && git show FETCH_HEAD:vault.bin > vault.bin && echo "restored from backup"
          else
            echo "first run - starting fresh"
          fi

      - name: Decrypt
        run: python -m jobradar cloud-restore vault.bin

      - name: Apply ticks from the dashboard
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -sf -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/applied.yml/runs?per_page=100" > ticks.json \
            && python -m jobradar cloud-ticks ticks.json || echo "no ticks"

      - name: Scan, score, tailor CVs, alert
        timeout-minutes: 30
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          IMAP_USER: ${{ secrets.IMAP_USER }}
          IMAP_PASSWORD: ${{ secrets.IMAP_PASSWORD }}
          IMAP_HOST: ${{ vars.IMAP_HOST }}
          # e-mail alerts: EMAIL_TO = where they go; SMTP_* default to the IMAP mailbox above (same Gmail app password)
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          LLM_PROVIDER: ${{ vars.LLM_PROVIDER }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          # RankOne X wording: free Gemini key if set (Google may use free-tier inputs), else rule-based only
          RANKONE_LLM_PROVIDER: ${{ secrets.GEMINI_API_KEY != '' && 'gemini' || 'demo' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          JOBRADAR_TELEGRAM_COMMANDS: "1"
          JOBRADAR_MAX_RUNTIME: "480"
        run: |
          mkdir -p state
          FORCE=""; [ "${{ github.event.inputs.force }}" = "true" ] && FORCE="--force"
          # the detailed log can mention your matches, so it goes into the encrypted vault, not the public log
          set +e
          if [ "${{ github.event.inputs.quick }}" = "true" ]; then
            python -m jobradar resume > state/last_run.log 2>&1      # CV keywords you just confirmed - no scan needed
          else
            python -m jobradar scan $FORCE --trigger "${{ github.event_name }}" > state/last_run.log 2>&1
          fi
          rc=$?
          if [ "${{ github.event.inputs.digest }}" = "true" ]; then python -m jobradar digest --force >> state/last_run.log 2>&1; fi
          set -e
          python -c "from jobradar.config import load_settings; from jobradar.db import Database; from jobradar.dashboard import coverage_stats; s = coverage_stats(Database(str(load_settings().path('database')))); print({k: s.get(k) for k in ('companies_discovered', 'sources_monitored_ok', 'sources_failing', 'vacancies_active', 'relevant_jobs', 'alerts_sent')})" 2>/dev/null || true
          if [ $rc -ne 0 ]; then echo "::error::scan failed: $(tail -n 1 state/last_run.log | cut -c1-200)"; exit $rc; fi

      - name: Encrypt state
        if: always()
        run: |
          pkill -f "jobradar scan" 2>/dev/null && sleep 3 || true   # a timed-out scan must not keep the database locked
          [ -f state/jobradar.db ] && python -m jobradar cloud-save vault.bin || echo "nothing to save"

      - name: Save encrypted state (cache)
        if: always() && hashFiles('vault.bin') != ''
        uses: actions/cache/save@v4
        with:
          path: vault.bin
          key: vault-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Backup encrypted state to the `state` branch (every ~3 hours)
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          [ -f vault.bin ] || exit 0
          h=$(date -u +%H); m=$(date -u +%M)
          if [ $((10#$h % 3)) -ne 0 ] || [ $((10#$m)) -ge 20 ]; then
            if [ "${{ steps.cache.outputs.cache-matched-key }}" != "" ] && [ "${{ github.event_name }}" = "schedule" ]; then exit 0; fi
          fi
          tmp=$(mktemp -d); cp vault.bin "$tmp/"; cd "$tmp"
          git init -q -b state && git add vault.bin
          git -c user.name=jobradar-bot -c user.email=41898282+github-actions[bot]@users.noreply.github.com commit -q -m "encrypted state $(date -u +%FT%TZ)"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" state

      - name: Newest Android app (for the app's one-tap updater)
        if: always() && env.HAS_RANKONEX == 'true'
        env:
          GH_TOKEN: ${{ secrets.RANKONEX_TOKEN }}
        run: |
          d="$RUNNER_TEMP/apk"; mkdir -p "$d"
          if gh release download android-latest --repo Nishadwankhede1/rankonex --pattern JobRadar.apk -D "$d" --clobber >/dev/null 2>&1; then
            b=$(gh release view android-latest --repo Nishadwankhede1/rankonex --json body --jq .body | sed -n 's/^Build \([0-9][0-9]*\).*/\1/p')
            echo "RANKONEX_APK=$d/JobRadar.apk" >> "$GITHUB_ENV"
            echo "RANKONEX_APK_BUILD=${b:-0}" >> "$GITHUB_ENV"
            echo "app build ${b:-?} will be published (encrypted)"
          else
            echo "no app release found – skipped"
          fi

      - name: Build encrypted dashboard
        id: pub
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          JOBRADAR_TICK_TOKEN: ${{ secrets.TICK_TOKEN }}
        run: |
          [ -f state/jobradar.db ] || exit 0
          python -m jobradar cloud-publish pages > /dev/null
          echo "published=true" >> "$GITHUB_OUTPUT"

      - name: Keep this dashboard for the combined site (UAE at /, Europe at /eu/)
        if: always() && steps.pub.outputs.published == 'true'
        uses: actions/cache/save@v4
        with:
          path: pages
          key: site-uae-${{ github.run_id }}-${{ github.run_attempt }}

  scan_eu:
    # Europe instance (Netherlands → Germany → UK). Switch on with the repository variable EU_ENABLED = true.
    # Runs after the UAE scan, never at the same time: many employers are read from the same Workday / Oracle servers,
    # which refuse callers that ask too often.
    needs: scan
    if: always() && vars.EU_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    concurrency:              # one scan at a time (they share the encrypted database)
      group: jobradar-state-eu
      cancel-in-progress: false
    outputs:
      published: ${{ steps.pub.outputs.published }}
    env:
      JOBRADAR_KEY: ${{ secrets.JOBRADAR_KEY }}
      JOBRADAR_REGION: eu
      JOBRADAR_COUNTRIES: ${{ vars.EU_COUNTRIES }}
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Safety check – no personal files in the public code
        run: |
          bad=0
          for f in config/resume.json config/profile.toml .env state output CLOUD_SETUP_PRIVATE.txt; do
            if [ -e "$f" ]; then echo "::error::'$f' must NOT be in this public repository - delete it on GitHub"; bad=1; fi
          done
          [ -n "$JOBRADAR_KEY" ] || { echo "::error::The JOBRADAR_KEY secret is missing (see CLOUD_SETUP_PRIVATE.txt on your PC)"; bad=1; }
          exit $bad

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-cloud.txt

      - name: Install
        run: pip install --quiet -r requirements-cloud.txt

      - name: Europe company list (global feeds from the UAE list + Netherlands employers)
        run: python scripts/build_companies_eu.py

      - name: CV font (Carlito, same metrics as Calibri)
        run: |
          if [ ! -f jobradar/resume/fonts/Carlito-Regular.ttf ] && [ ! -f /usr/share/fonts/truetype/crosextra/Carlito-Regular.ttf ]; then
            sudo apt-get install -y -qq fonts-crosextra-carlito >/dev/null 2>&1 || \
              (sudo apt-get update -qq >/dev/null && sudo apt-get install -y -qq fonts-crosextra-carlito >/dev/null)
          fi

      - name: Your private settings (from secrets, never printed)
        env:
          RESUME_JSON: ${{ secrets.RESUME_JSON }}
          PROFILE_TOML: ${{ secrets.PROFILE_TOML }}
        run: |
          [ -n "$PROFILE_TOML" ] || { echo "::error::The PROFILE_TOML secret is missing"; exit 1; }
          printf '%s' "$PROFILE_TOML" > config/profile.toml
          if [ -n "$RESUME_JSON" ]; then printf '%s' "$RESUME_JSON" > config/resume.json; fi

      - name: Restore encrypted state (cache)
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: vault_eu.bin
          key: euvault-${{ github.run_id }}
          restore-keys: euvault-

      - name: Restore encrypted state (backup branch)
        if: steps.cache.outputs.cache-matched-key == ''
        run: |
          if git ls-remote --exit-code --heads origin state-eu >/dev/null 2>&1; then
            git fetch -q --depth=1 origin state-eu && git show FETCH_HEAD:vault_eu.bin > vault_eu.bin && echo "restored from backup"
          else
            echo "first run - starting fresh"
          fi

      - name: Decrypt
        run: python -m jobradar cloud-restore vault_eu.bin

      - name: Apply ticks from the dashboard
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -sf -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/applied.yml/runs?per_page=100" > ticks.json \
            && python -m jobradar cloud-ticks ticks.json || echo "no ticks"

      - name: Scan, score, tailor CVs, alert
        timeout-minutes: 30
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN_EU || secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          IMAP_USER: ${{ secrets.IMAP_USER }}
          IMAP_PASSWORD: ${{ secrets.IMAP_PASSWORD }}
          IMAP_HOST: ${{ vars.IMAP_HOST }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          LLM_PROVIDER: ${{ vars.LLM_PROVIDER }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          JOBRADAR_TELEGRAM_COMMANDS: ${{ secrets.TELEGRAM_BOT_TOKEN_EU != '' && '1' || '0' }}
          JOOBLE_API_KEY: ${{ secrets.JOOBLE_API_KEY }}
          JOBRADAR_MAX_RUNTIME: "480"
        run: |
          mkdir -p state
          FORCE=""; [ "${{ github.event.inputs.force }}" = "true" ] && FORCE="--force"
          # the detailed log can mention your matches, so it goes into the encrypted vault, not the public log
          set +e
          if [ "${{ github.event.inputs.quick }}" = "true" ]; then
            python -m jobradar resume > state/last_run.log 2>&1      # CV keywords you just confirmed - no scan needed
          else
            python -m jobradar scan $FORCE --trigger "${{ github.event_name }}" > state/last_run.log 2>&1
          fi
          rc=$?
          if [ "${{ github.event.inputs.digest }}" = "true" ]; then python -m jobradar digest --force >> state/last_run.log 2>&1; fi
          set -e
          python -c "from jobradar.config import load_settings; from jobradar.db import Database; from jobradar.dashboard import coverage_stats; s = coverage_stats(Database(str(load_settings().path('database')))); print({k: s.get(k) for k in ('companies_discovered', 'sources_monitored_ok', 'sources_failing', 'vacancies_active', 'relevant_jobs', 'alerts_sent')})" 2>/dev/null || true
          if [ $rc -ne 0 ]; then echo "::error::scan failed: $(tail -n 1 state/last_run.log | cut -c1-200)"; exit $rc; fi

      - name: Encrypt state
        if: always()
        run: |
          pkill -f "jobradar scan" 2>/dev/null && sleep 3 || true   # a timed-out scan must not keep the database locked
          [ -f state/jobradar_eu.db ] && python -m jobradar cloud-save vault_eu.bin || echo "nothing to save"

      - name: Save encrypted state (cache)
        if: always() && hashFiles('vault_eu.bin') != ''
        uses: actions/cache/save@v4
        with:
          path: vault_eu.bin
          key: euvault-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Backup encrypted state to the `state-eu` branch (every ~3 hours)
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          [ -f vault_eu.bin ] || exit 0
          h=$(date -u +%H); m=$(date -u +%M)
          if [ $((10#$h % 3)) -ne 0 ] || [ $((10#$m)) -ge 20 ]; then
            if [ "${{ steps.cache.outputs.cache-matched-key }}" != "" ] && [ "${{ github.event_name }}" = "schedule" ]; then exit 0; fi
          fi
          tmp=$(mktemp -d); cp vault_eu.bin "$tmp/"; cd "$tmp"
          git init -q -b state-eu && git add vault_eu.bin
          git -c user.name=jobradar-bot -c user.email=41898282+github-actions[bot]@users.noreply.github.com commit -q -m "encrypted state $(date -u +%FT%TZ)"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" state-eu

      - name: Build encrypted dashboard
        id: pub
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN_EU || secrets.TELEGRAM_BOT_TOKEN }}
          JOBRADAR_TICK_TOKEN: ${{ secrets.TICK_TOKEN }}
        run: |
          [ -f state/jobradar_eu.db ] || exit 0
          python -m jobradar cloud-publish pages/eu > /dev/null
          echo "published=true" >> "$GITHUB_OUTPUT"

      - name: Keep this dashboard for the combined site (Europe at /eu/)
        if: always() && steps.pub.outputs.published == 'true'
        uses: actions/cache/save@v4
        with:
          path: pages/eu
          key: site-eu-${{ github.run_id }}-${{ github.run_attempt }}

  deploy:
    needs: [scan, scan_eu]
    if: always() && (needs.scan.outputs.published == 'true' || needs.scan_eu.outputs.published == 'true')
    runs-on: ubuntu-latest
    concurrency:
      group: jobradar-pages
      cancel-in-progress: false
    environment:
      name: github-pages
    steps:
      # one site, two dashboards: UAE at /, Europe at /eu/ – each taken from its latest build (this run's, if it ran)
      - uses: actions/cache/restore@v4
        with:
          path: pages
          key: site-uae-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: site-uae-
      - uses: actions/cache/restore@v4
        with:
          path: pages/eu
          key: site-eu-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: site-eu-
      - name: Check the site
        run: |
          [ -f pages/index.html ] || { echo "::error::no UAE dashboard build found"; exit 1; }
          ls pages; [ -d pages/eu ] && echo "Europe dashboard included" || echo "no Europe dashboard yet"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: pages
      - uses: actions/deploy-pages@v4

  next:
    needs: [scan, scan_eu, deploy]
    if: always() && github.event.inputs.quick != 'true' && vars.SCAN_CHAIN != 'off'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: write
    steps:
      - name: Start the next scan ~15 minutes after this one began
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GAP: ${{ vars.SCAN_GAP_MINUTES || '15' }}
          REF: ${{ github.ref_name }}
        shell: python
        run: |
          import json, os, time, urllib.request
          from datetime import datetime
          api = f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/actions"
          me = int(os.environ["GITHUB_RUN_ID"])
          def call(path, data=None):
              req = urllib.request.Request(api + path, data=json.dumps(data).encode() if data else None,
                                           method="POST" if data else "GET",
                                           headers={"Authorization": "Bearer " + os.environ["GH_TOKEN"],
                                                    "Accept": "application/vnd.github+json"})
              with urllib.request.urlopen(req, timeout=30) as r:
                  body = r.read()
                  return json.loads(body) if body else {}
          started = datetime.fromisoformat(call(f"/runs/{me}")["run_started_at"].replace("Z", "+00:00")).timestamp()
          wait = min(900, started + max(5, int(os.environ["GAP"] or 15)) * 60 - time.time())
          if wait > 0:
              print(f"next scan in {int(wait)} s"); time.sleep(wait)
          # one chain only: hand over to a waiting scan, or to a newer one that is already running
          for status in ("queued", "waiting", "pending", "requested", "in_progress"):
              for r in call(f"/workflows/scan.yml/runs?status={status}&per_page=30").get("workflow_runs", []):
                  if r["id"] == me or "quick" in (r.get("display_title") or "").lower():
                      continue
                  if status != "in_progress" or r["id"] > me:
                      print(f"scan {r['id']} is {status} - it continues the chain"); raise SystemExit(0)
          call("/workflows/scan.yml/dispatches", {"ref": os.environ["REF"]})
          print("next scan started")
